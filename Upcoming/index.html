    <script>
      tailwind.config = {
        darkMode: 'class', 
        theme: {
          extend: {
            colors: {
              brand: {

                DEFAULT: '#7f00ff',
                dark: '#6002ee',
              }
            }
          }
        }

    <style>
      body {
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      }
      .sebnavbar-background-dark {
        background-color: #7f00ff !important;
      }
            a.badge-link, a.badge-link:hover, a.badge-link:focus {
        text-decoration: none !important;
      }
      .loader {
        border-top-color: #7f00ff;
        -webkit-animation: spinner 1.5s linear infinite;
        animation: spinner 1.5s linear infinite;
      }
      
      @keyframes spinner {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
    </style>
    <style>
      .sebtable th {
        background-color: #f8f9fa;
      }

      .night-mode .sebtable th {
        background-color: #374151;
        color: white;
      }

      .night-mode .sebtable td {
        color: #e5e7eb;
      }

      .night-mode .table-striped > tbody > tr:nth-of-type(odd) {
        background-color: #374151;
      }

      .night-mode .table-striped > tbody > tr:nth-of-type(even) {
        background-color: #1f2937;
      }
    </style>
