<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JSON Schedule Validator</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .error-highlight { background-color: #fca5a5; color: #7f1d1d; font-weight: bold; }
        pre { white-space: pre-wrap; word-wrap: break-word; }
    </style>
</head>
<body class="bg-gray-100 p-8 font-sans">

    <div class="max-w-4xl mx-auto bg-white p-6 rounded-lg shadow-lg">
        <h1 class="text-2xl font-bold mb-4 text-gray-800">🔍 JSON Validator</h1>
        <p class="mb-4 text-gray-600">This tool fetches <code class="bg-gray-200 px-1 rounded">data.json</code> and checks for syntax errors.</p>
        
        <button onclick="validate()" class="bg-blue-600 text-white px-4 py-2 rounded hover:bg-blue-700 transition">
            Check Now
        </button>

        <div id="status" class="mt-6 p-4 rounded hidden"></div>

        <h3 class="mt-6 font-bold text-gray-700">File Content Preview:</h3>
        <pre id="preview" class="mt-2 bg-gray-50 p-4 border rounded text-sm text-gray-700 font-mono h-96 overflow-y-scroll"></pre>
    </div>

    <script>
        async function validate() {
            const statusEl = document.getElementById('status');
            const previewEl = document.getElementById('preview');
            
            statusEl.className = 'mt-6 p-4 rounded bg-gray-200 text-gray-800';
            statusEl.textContent = 'Loading data.json...';
            statusEl.classList.remove('hidden');

            try {
                // Add timestamp to prevent caching
                const res = await fetch('./Module/data.json?t=' + Date.now());
                
                if (!res.ok) throw new Error(`HTTP Error: ${res.status}`);
                
                const text = await res.text();
                
                try {
                    // 1. Try to Parse
                    JSON.parse(text);
                    
                    // 2. If successful:
                    statusEl.className = 'mt-6 p-4 rounded bg-green-100 text-green-800 border border-green-200';
                    statusEl.innerHTML = `<strong>✅ Success!</strong> Your JSON is valid. The schedule should load correctly.`;
                    previewEl.textContent = text;
                    
                } catch (parseError) {
                    // 3. If Syntax Error found
                    statusEl.className = 'mt-6 p-4 rounded bg-red-100 text-red-800 border border-red-200';
                    statusEl.innerHTML = `<strong>❌ Syntax Error:</strong> ${parseError.message}`;
                    
                    // Highlight the error in the preview
                    highlightError(text, parseError);
                }

            } catch (networkError) {
                statusEl.className = 'mt-6 p-4 rounded bg-red-100 text-red-800 border border-red-200';
                statusEl.innerHTML = `<strong>⚠️ Network Error:</strong> Could not find 'data.json'.<br>Are you running this via Local Server or GitHub Pages?`;
            }
        }

        function highlightError(jsonText, error) {
            const previewEl = document.getElementById('preview');
            
            // Try to extract position from error message (e.g., "at position 45")
            const match = error.message.match(/position (\d+)/);
            if (match) {
                const pos = parseInt(match[1], 10);
                const before = jsonText.substring(0, pos);
                const errChar = jsonText.substring(pos, pos + 1) || "END";
                const after = jsonText.substring(pos + 1);

                // Create highlighted HTML
                previewEl.innerHTML = escapeHtml(before) + 
                    `<span class="error-highlight"> >>${escapeHtml(errChar)}<< </span>` + 
                    escapeHtml(after);
                
                // Scroll to error
                setTimeout(() => {
                    const el = document.querySelector('.error-highlight');
                    if(el) el.scrollIntoView({behavior: "smooth", block: "center"});
                }, 100);
            } else {
                previewEl.textContent = jsonText;
            }
        }

        function escapeHtml(text) {
            return text.replace(/&/g, "&amp;")
                       .replace(/</g, "&lt;")
                       .replace(/>/g, "&gt;")
                       .replace(/"/g, "&quot;")
                       .replace(/'/g, "&#039;");
        }
    </script>
</body>
</html>
