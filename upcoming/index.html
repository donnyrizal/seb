<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Dashboard Ujian Psikologi UMS" />
    <meta name="author" content="Donny" />
    <link
      rel="icon"
      type="image/png"
      href="https://ums.id/static/assets/image_ums/logo_ums_white.png"
      sizes="32x32"
    />
    <title>Dashboard Ujian Psikologi UMS</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="../Module/style.css" />
    <style>
      html {
        font-family: "Montserrat", sans-serif;
        scroll-behavior: smooth;
      }

      body {
        transition: background-color 0.3s ease-in-out, color 0.3s ease-in-out;
      }

      /* Dark Mode Specific Overrides */
      body.night-mode ::selection {
        background-color: #7f00ff;
        color: white;
      }

      /* Animations */
      @keyframes fadeIn {
        from {
          opacity: 0;
          transform: translateY(10px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      .course-card {
        animation: fadeIn 0.5s ease-out forwards;
      }

      /* Hover effects for cards */
      .group:hover .badge-link {
        transform: translateY(-2px);
        box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1),
          0 2px 4px -1px rgba(0, 0, 0, 0.06);
      }
    </style>
  </head>

  <body
    class="bg-gray-50 text-gray-900 dark:bg-gray-900 dark:text-gray-100 transition-colors duration-300 min-h-screen flex flex-col"
  >
    <!-- Theme Toggle -->
    <button
      id="theme-toggle"
      type="button"
      class="fixed bottom-6 left-6 z-50 p-3 rounded-full bg-white dark:bg-gray-700 text-gray-900 dark:text-white shadow-xl hover:scale-110 transition-all border border-gray-200 dark:border-gray-600"
      aria-label="Toggle Dark Mode"
    >
      <svg
        id="theme-toggle-dark-icon"
        class="w-6 h-6"
        fill="currentColor"
        viewBox="0 0 20 20"
      >
        <path
          d="M17.293 13.293A8 8 0 016.707 2.707a8.001 8.001 0 1010.586 10.586z"
        ></path>
      </svg>
      <svg
        id="theme-toggle-light-icon"
        class="w-6 h-6 hidden"
        fill="currentColor"
        viewBox="0 0 20 20"
      >
        <path
          d="M10 2a1 1 0 011 1v1a1 1 0 11-2 0V3a1 1 0 011-1zm4 8a4 4 0 11-8 0 4 4 0 018 0zm-.464 4.95l.707.707a1 1 0 001.414-1.414l-.707-.707a1 1 0 00-1.414 1.414zm2.12-10.607a1 1 0 010 1.414l-.707.707a1 1 0 11-1.414-1.414l.707-.707a1 1 0 011.414 0zM17 11a1 1 0 100-2h-1a1 1 0 100 2h1zm-1.636 4.364a1 1 0 01-1.414 0l-.707-.707a1 1 0 011.414-1.414l.707.707a1 1 0 010 1.414zM10 18a1 1 0 01-1-1v-1a1 1 0 112 0v1a1 1 0 01-1 1zM3.636 4.364a1 1 0 011.414 0l.707.707a1 1 0 11-1.414 1.414L3.636 5.778a1 1 0 010-1.414zM3 11a1 1 0 100-2H2a1 1 0 100 2h1zM4.636 15.636a1 1 0 010-1.414l.707-.707a1 1 0 111.414 1.414l-.707.707a1 1 0 01-1.414 0z"
        ></path>
      </svg>
    </button>

    <!-- Navbar -->
    <nav
      class="sebnavbar-background-dark fixed top-0 left-0 w-full z-50 shadow-md"
    >
      <div
        class="container mx-auto px-4 flex justify-between items-center h-24"
      >
        <div class="flex items-center">
          <a href="../index.html" class="block">
            <img
              class="sebbrandimg"
              src="../logo-sarjana-psikologi (1).svg"
              alt="SEB Logo"
              width="250"
            />
          </a>
        </div>

        <div class="flex items-center">
          <a href="index.html" class="block">
            <img
              class="sebbrandimg"
              src="../upcomingg.svg"
              alt="upcoming"
              width="250"
            />
          </a>
        </div>
      </div>
    </nav>

    <!-- Main Content -->
    <div class="container mx-auto px-4 py-8 pt-28 max-w-5xl flex-grow">
      <!-- Dashboard Header / Stats -->
      <div
        id="stats-container"
        class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-10 hidden course-card"
      >
        <!-- Populated by JS -->
      </div>

      <!-- Loading State -->
      <div
        id="loading-spinner"
        class="flex flex-col items-center justify-center py-20"
      >
        <div
          class="animate-spin rounded-full border-4 border-t-4 border-brand h-12 w-12 mb-4 border-gray-200"
        ></div>
        <p class="text-gray-500 dark:text-gray-400 font-medium">
          Menyinkronkan Data...
        </p>
      </div>

      <!-- UPCOMING SECTION -->
      <div id="upcoming-wrapper" class="hidden">
        <div class="flex items-center gap-3 mb-6">
          <h2 class="text-2xl font-bold text-gray-800 dark:text-white">
            Upcoming Schedule
          </h2>
          <div
            class="h-1 flex-1 bg-gray-200 dark:bg-gray-700 rounded-full"
          ></div>
        </div>
        <div id="upcoming-container" class="space-y-6"></div>
      </div>

      <!-- EMPTY STATE (No Upcoming) -->
      <div
        id="empty-state"
        class="hidden text-center py-12 bg-white dark:bg-gray-800 rounded-2xl shadow-sm border border-gray-200 dark:border-gray-700 mb-10"
      >
        <div class="text-5xl mb-4">🎉</div>
        <h3 class="text-xl font-bold text-gray-800 dark:text-white">
          Tidak ada jadwal mendatang
        </h3>
        <p class="text-gray-500 dark:text-gray-400 mt-2">
          Selamat! Anda bisa beristirahat sejenak.
        </p>
      </div>

      <!-- HISTORY / DONE SECTION -->
      <div id="history-wrapper" class="mt-16 hidden">
        <div class="flex items-center gap-3 mb-6">
          <h2 class="text-xl font-bold text-gray-500 dark:text-gray-400">
            Riwayat Selesai
          </h2>
          <div class="h-px flex-1 bg-gray-200 dark:bg-gray-800"></div>
        </div>
        <div id="history-container" class="space-y-4"></div>
      </div>
    </div>

    <!-- Footer -->
    <footer>
      <div class="text-center">
        <p>Made with 💓 Donny</p>
        <p>
          Copyright &copy; 2025
          <a href="https://psikologi.ums.ac.id">Sarjana Psikologi UMS</a>
        </p>
      </div>
    </footer>
  </body>
  <script src="./script.js"></script>
</html>
